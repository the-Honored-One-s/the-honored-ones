<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Honored Ones</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            text-align: center;
        }

        .name {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(40px, 5vw, 90px);
            font-weight: 700;
            letter-spacing: -3px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="name">The Honored Ones</div>
        <h1>We Are Coming Soon</h1>
    </div>

</body>
</html>
